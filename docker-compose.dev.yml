services:

  frontend:
    image: frontend-dev
    build:
      context: ./frontend
      dockerfile: dev.Dockerfile
    container_name: frontend-dev

  backend:
    image: backend-dev
    build:
      context: ./backend
      dockerfile: dev.Dockerfile
    container_name: backend-dev

  nginx:
    image: nginx:1.29
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80
    container_name: nginx-proxy
    depends_on:
      - frontend
      - backend